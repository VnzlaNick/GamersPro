<!-- 1. Cargamos la librería oficial de Supabase -->
<script src="https://jsdelivr.net"></script>

<script>
  // 2. Configuración de tus credenciales
  const SUPABASE_URL = "https://zrrpjbqduwtaxsfbsuum.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpycnBqYnFkdXd0YXhzZmJzdXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNDY5NDYsImV4cCI6MjA5NzgyMjk0Nn0.nrm0_IUxJ_30uY5jEeA_J2NNfzA7wE0g4OO51NVsORc";
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const muListaContainer = document.getElementById('contenedor-mu-lista');

  // 3. Función para leer y mostrar los posts de Servidores Mu
  async function cargarPostsDeMu() {
    if (!muListaContainer) return;

    // Pedimos a Supabase solo las publicaciones de la categoría 'Servidores Mu'
    const { data: posts, error } = await supabase
      .from('posts')
      .select('*')
      .eq('category', 'Servidores Mu')
      .order('created_at', { ascending: false });

    if (error) {
      console.error("Error cargando la lista de Mu:", error.message);
      return;
    }

    // Limpiamos el contenedor
    muListaContainer.innerHTML = '';

    // Si nadie ha publicado todavía
    if (posts.length === 0) {
      muListaContainer.innerHTML = `
        <div class="text-center p-8 text-portal-text-muted text-xs">
          No se ha publicado ningún servidor Mu todavía. ¡Sé el primero!
        </div>
      `;
      return;
    }

    // Recorremos cada post en la base de datos e inyectamos tu estética exacta
    posts.forEach(post => {
      muListaContainer.innerHTML += `
        <div class="forum-row p-4 flex gap-4 border-b border-portal-border/40 bg-portal-bg/20 hover:bg-portal-blue/5 transition-colors"> 
          <div class="flex-shrink-0">
            <div class="w-10 h-10 rounded-lg bg-portal-blue/10 flex items-center justify-center border border-portal-blue/20">
              <span class="material-symbols-outlined text-portal-blue">sports_esports</span>
            </div>
          </div> 
          <div class="flex-grow">
            <div class="flex justify-between items-start">
              <h3 class="font-bold text-sm text-portal-text">${post.title}</h3>
              <div class="text-[10px] text-portal-text-muted text-right leading-tight">
                <p>${new Date(post.created_at).toLocaleDateString()}</p>
              </div>
            </div>
            <p class="text-[12px] text-portal-text-muted mt-1 leading-relaxed" style="white-space: pre-line;">
              ${post.content}
            </p>
            <div class="mt-2.5 flex items-center gap-2 text-[10px] text-portal-text-muted">
              <span>Publicado por: <strong class="text-portal-blue">${post.nickname}</strong></span>
            </div>
          </div>
        </div>
      `;
    });
  }

  // Ejecutar de forma automática cuando cargue la página
  window.addEventListener('DOMContentLoaded', cargarPostsDeMu);
</script>
