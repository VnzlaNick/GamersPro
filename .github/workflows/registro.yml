name: Registrar Usuario en Supabase

on:
  discussion:
    types: [created]

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar datos a Supabase
        run: |
          # Limpiamos la URL quitando cualquier barra inclinada al final para evitar errores
          CLEAN_URL=$(echo "${{ secrets.SUPABASE_URL }}" | sed 's/\/$//')
          
          curl -X POST "$CLEAN_URL/rest/v1/usuarios_foro" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: resolution=merge-duplicates" \
          -d '[
            {
              "github_id": ${{ github.event.sender.id }},
              "username": "${{ github.event.sender.login }}",
              "avatar_url": "${{ github.event.sender.avatar_url }}"
            }
          ]'
          
