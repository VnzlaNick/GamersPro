<!-- Registration Form Card -->
<div class="bg-surface-container-lowest border border-outline-variant p-6 rounded-xl ambient-shadow">
<form id="registro-form" class="space-y-6">
<!-- Username -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface ml-1">Nombre de usuario</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px]">person</span>
<input id="username" class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md outline-none" placeholder="Ej: PlayerOne" style="--tw-ring-color: #2196f3; border-color: inherit;" type="text" required/>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface ml-1">Correo electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px]">mail</span>
<input id="email" class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md outline-none" placeholder="tu@email.com" style="--tw-ring-color: #2196f3; border-color: inherit;" type="email" required/>
</div>
</div>
<!-- Password -->

</div>
</div>

<!-- Submit Button -->
<button type="submit" class="w-full py-3 bg-primary text-white font-label-md rounded-lg shadow-md hover:bg-opacity-90 transition-all font-bold" style="background-color: #2196f3;">
    Crear Cuenta
</button>

<!-- 1. Carga correcta de la librería SDK oficial de Supabase -->
<script src="https://jsdelivr.net"></script>

<!-- 2. Conexión e interactividad lógica -->
<script>
    // Credenciales del proyecto GamersPro en Supabase
    const SUPABASE_URL = "https://zrrpjbqduwtaxsft.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7sOPZc2sJT4jExW3gAREgA_GBpRe6Rp"; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Escuchar el envío del formulario de registro
    document.getElementById('registro-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Registro en Supabase Auth
        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: username
                }
            }
        });

        if (error) {
            alert("Error en el registro: " + error.message);
        } else {
            alert("¡Cuenta creada con éxito! Por favor, revisa tu correo electrónico para confirmarla.");
            window.location.href = "https://vnzlanick.github.io/GamersPro/";
        }
    });
</script>
